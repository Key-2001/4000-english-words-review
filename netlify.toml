# Cấu hình deploy Netlify cho app React + Vite (SPA)
[build]
  command = "npm run build"
  publish = "dist"

# React Router dùng client-side routing: mọi đường dẫn trả về index.html
# để các trang như /vocabulary, /practice không bị lỗi 404 khi tải trực tiếp.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker và manifest luôn lấy bản mới để app tự cập nhật sau mỗi lần deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
